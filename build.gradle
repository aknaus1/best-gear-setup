plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.bestgearsetup.BestGearSetupPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.1'
	testImplementation 'org.mockito:mockito-core:5.17.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.bestgearsetup'
// Keep in step with version= in runelite-plugin.properties, which is what the Plugin Hub shows.
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Pass -Dbgs.* options (e.g. -Dbgs.oracle.cases=5000) through to the test JVM.
test {
	systemProperties System.properties.findAll { it.key.toString().startsWith('bgs.') }
}

// DistributionNoticesTest compares the bundled notices with the repository copies.
processTestResources {
	from('LICENSE') { into 'repository' }
	from('THIRD_PARTY_NOTICES.md') { into 'repository' }
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}
